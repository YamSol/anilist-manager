# Configuração principal do nginx que serve o dist/ estático do AniList Manager.
#
# Substitui /etc/nginx/nginx.conf inteiro (e não um snippet em conf.d) por dois
# motivos: o container roda como usuário não-root, então o pid e os diretórios
# temporários precisam sair de /var/run e /var/cache; e a política de cache é
# definida por um `map` no contexto http, que só existe aqui.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # O container roda não-root com filesystem somente-leitura: tudo que o nginx
  # escreve vai para /tmp, montado como tmpfs.
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  access_log /dev/stdout combined;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    image/svg+xml;

  # Política de cache resolvida por URI, em um lugar só.
  #
  # Um `add_header` dentro de um location descarta todos os headers herdados do
  # server, então espalhar Cache-Control por location derrubaria silenciosamente
  # os headers de segurança. Com o map, todos os add_header ficam no server.
  #
  # Só entra em "immutable" o que o Vite versiona por hash no nome. O default é
  # `no-cache` (revalida sempre, responde 304 quando não mudou), que é o que
  # index.html, sw.js e registerSW.js precisam: um service worker cacheado por
  # muito tempo trava o app numa versão antiga para sempre.
  map $uri $cache_control {
    default                    "no-cache";
    ~^/assets/                 "public, max-age=31536000, immutable";
    ~^/workbox-[0-9a-f]+\.js$  "public, max-age=31536000, immutable";
  }

  server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # O app é 100% client-side e só fala com graphql.anilist.co (RNF-01, RNF-11).
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://graphql.anilist.co; img-src 'self' data: https://s4.anilist.co https://img.anili.st; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    # Usado pelo healthcheck do compose.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Proxy de troca de token (AD-10).
    #
    # O AniList não manda CORS no /oauth/token — o preflight OPTIONS responde 404 e
    # o POST volta sem Access-Control-Allow-Origin. Sem este proxy de mesma origem o
    # browser não consegue trocar o authorization code, e o login cairia para o
    # fluxo manual de colar token. O par em desenvolvimento está no vite.config.ts.
    #
    # O que trafega aqui é o Client Secret DO USUÁRIO, do client que ele registrou
    # no AniList — não há segredo da aplicação (RNF-02). Por isso o access_log fica
    # desligado neste location: o corpo não vai para log, e nada é persistido.
    location = /oauth/token {
      access_log off;

      proxy_pass https://anilist.co/api/v2/oauth/token;
      proxy_http_version 1.1;
      proxy_set_header Host anilist.co;
      proxy_set_header Connection "";
      # Não repassa Origin/Referer: o AniList não precisa saber de onde partiu, e
      # a resposta é consumida por mesma origem.
      proxy_set_header Origin "";
      proxy_set_header Referer "";
      proxy_ssl_server_name on;
      proxy_ssl_protocols TLSv1.2 TLSv1.3;

      # A troca é rápida; um proxy pendurado prende o usuário numa tela de espera.
      proxy_connect_timeout 10s;
      proxy_read_timeout 20s;

      # O Cache-Control do map não vale para uma resposta que carrega credencial.
      add_header Cache-Control "no-store" always;
    }

    # mime.types do nginx não conhece .webmanifest.
    location = /manifest.webmanifest {
      default_type application/manifest+json;
    }

    # Bundles com hash no nome. Um chunk que sumiu é 404, nunca o index.html:
    # devolver HTML no lugar de JS produz um erro de sintaxe indecifrável.
    location /assets/ {
      try_files $uri =404;
    }

    # Fallback de SPA: qualquer rota desconhecida entrega o shell (RNF-05).
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
